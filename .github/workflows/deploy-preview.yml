name: Deploy previews (push)

# 每次 push 只刷新分支预览；主站仍停在最近一次 Release 的 tag。
# 本工作流只负责构建，产物由 publish-previews.yml 在默认分支上下文里发布：
# github-pages 环境的部署分支策略匹配不到带斜杠的分支名（fix/x、dependabot/x/y）。
# 主站与预览同属一个 Pages 产物，所以这里仍要重建主站，只是主站版本取最近一次 Release。

on:
  push:
    # 只跟分支：tag 的部署由 Release 事件负责
    branches: ['**']
    # 纯文档 / 工具 / 资料整理不改变站点产物，不值得重建主站与最多 8 个预览
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '_tools/**'
      - 'supabase/**'
      - 'LICENSE*'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/dependabot.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# 同一分支连推时取消旧构建；发布由 publish-previews 串行处理
concurrency:
  group: build-previews-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    # 删除分支也会触发 push 事件；那只是下线预览，下一次运行自然带上
    if: github.event_name != 'push' || (!github.event.deleted && !startsWith(github.ref_name, 'release-please--'))
    uses: ./.github/workflows/deploy-site.yml
    with:
      publish: false
