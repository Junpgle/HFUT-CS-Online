name: Deploy (main + branch previews)

# 一次运行产出一个完整站点：根目录永远是 origin/main，分支预览挂在 /preview/<slug>/ 下。
# 主站与预览同属一个 Pages 产物，所以任何触发都不会把对方刷掉；PR 内容只在预览子目录里。
# 只由 push / 手动触发：PR 事件构建出的是 refs/pull/N/merge，Pages 环境保护拒绝它部署，
# 而同一个 pages 并发组里它会取消掉真正能发布的 push 运行——结果是主站静默停更。
# PR 的类型检查与测试由 CI 工作流负责；预览内容随分支 push 刷新。
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: read

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SITE_BASE: /HFUT-CS-Online/
  PREVIEW_MAX: '8'
  PREVIEW_TTL_DAYS: '14'

jobs:
  build:
    runs-on: ubuntu-latest
    # release-please 更新发布 PR 时也会 push 分支；那只是改版本号与 CHANGELOG，
    # 主站与预览列表都不变，不值得跑一次全量部署，直接跳过。
    if: github.event_name != 'push' || !startsWith(github.ref_name, 'release-please--')
    # Supabase 连接信息（Publishable Key，可公开）；未配置时站点自动退回纯本地模式
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 主站一律从 origin/main 构建：分支 push 与手动 dispatch 都先切过去
      - name: 切到 main
        run: git checkout -f -B main origin/main

      - run: npm ci

      - name: 类型检查与测试
        run: |
          npx tsc -b
          npx vitest run

      - name: 构建主站
        run: npm run build

      - name: 计算预览目标
        id: targets
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/preview-targets.mjs

      - name: 构建分支预览
        if: steps.targets.outputs.count != '0'
        env:
          SITE_BASE: ${{ env.SITE_BASE }}
        run: bash .github/scripts/build-previews.sh "${{ steps.targets.outputs.file }}" dist

      - name: 生成预览索引页
        env:
          PREVIEW_TARGETS_FILE: ${{ steps.targets.outputs.file }}
        run: node .github/scripts/preview-index.mjs "$PREVIEW_TARGETS_FILE" "${RUNNER_TEMP}/preview-built.txt" dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
