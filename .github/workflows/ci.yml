name: CI

on:
  push:
    branches: [main]
  pull_request:

# 只读检出：本工作流不需要写仓库，锁死 GITHUB_TOKEN 权限
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: npx vitest run
      - run: npm run build
