name: Release Please

# 依据 Conventional Commits 自动维护版本号、CHANGELOG.md 与 Git 标签：
# 每次 push 到 main 都开/更新一个 release PR，合并它才真正打 tag 并发 GitHub Release。
# 版本号的唯一来源是 package.json（与 .release-please-manifest.json 保持一致），
# 发布配置见 release-please-config.json。

on:
  push:
    branches: [main]
  # 改完发布配置或仓库设置后，可在 Actions 页手动跑一次，不必等下一次 push
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# 连推 main 时排队处理，避免两次运行同时改同一个 release PR
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # 默认 GITHUB_TOKEN 建出的 PR 不会触发 pull_request 工作流（CI 不会跑）。
          # 需要 release PR 也过 CI 时，建一个 Fine-grained PAT
          # （contents、pull-requests: write）存为仓库 Secret `RELEASE_PLEASE_TOKEN`。
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
